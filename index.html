<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yoon 작업실</title>
<meta name="description" content="직접 만들어 쓰는 프로그램과 업데이트 소식 — G2B monitor, YouTurbe Morphe">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#F4F4F0;
  --card:#FFFFFF;
  --ink:#151A21;
  --muted:#6A727A;
  --line:#E2E3DD;
  --g2b:#1A3C8C; --g2b-t:#E8EEFB;
  --yt:#D3112E;  --yt-t:#FDE8EB;
  --net:#0E7A62; --net-t:#E2F3EE;
  --num:"Archivo","Pretendard Variable",sans-serif;
  --text:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid #F2B705;outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px}
.g2b{--c:var(--g2b);--t:var(--g2b-t)}
.yt{--c:var(--yt);--t:var(--yt-t)}
.net{--c:var(--net);--t:var(--net-t)}

/* ---------- 상단 메뉴 ---------- */
.nav{position:sticky;top:0;z-index:10;background:rgba(244,244,240,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--line)}
.nav .wrap{display:flex;align-items:center;height:64px;gap:28px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em;text-decoration:none}
.logo img{width:30px;height:30px;border-radius:9px;background:#D9DCD6}
.nav nav{display:flex;gap:4px;margin-left:auto}
.nav nav a{text-decoration:none;font-size:15px;font-weight:600;color:var(--muted);padding:7px 12px;border-radius:8px}
.nav nav a:hover{color:var(--ink);background:rgba(0,0,0,.04)}
.nav nav a.gh{color:var(--ink);border:1.5px solid var(--ink);margin-left:6px}

/* ---------- 첫 화면 ---------- */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:56px;align-items:center;padding:64px 0 56px}
.hero h1{font-size:clamp(40px,6vw,72px);line-height:1.08;letter-spacing:-.045em;margin:0;font-weight:800}
.hero p{font-size:18px;color:var(--muted);margin:22px 0 0;max-width:30em}
.hero .links{display:flex;gap:10px;margin-top:32px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;background:var(--ink);color:#fff}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.line:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}

/* 오른쪽: 가장 최근 소식 (실시간) */
.latest{position:relative}
.latest .stack{position:relative;height:340px}
.tile{position:absolute;width:74%;padding:20px 22px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:0 30px 60px -30px rgba(21,26,33,.25)}
.tile:nth-child(1){right:0;top:0;transform:rotate(2.5deg)}
.tile:nth-child(2){left:0;top:172px;transform:rotate(-2deg)}
.tile .hd{display:flex;align-items:center;gap:12px}
.tile .ic{flex:none;width:40px;height:40px;border-radius:11px;background:var(--c);color:#fff;display:grid;place-items:center}
.tile .ic svg{width:22px;height:22px}
.tile .nm{font-weight:800;font-size:16px;line-height:1.25}
.tile .ver{font-family:var(--num);font-stretch:70%;font-weight:900;font-size:64px;line-height:.95;color:var(--c);margin-top:12px;letter-spacing:-.01em}
.tile .when{font-size:12.5px;color:var(--muted);font-weight:500}
.tile .new{margin-left:6px;font-size:12px;font-weight:700;color:var(--c);background:var(--t);padding:3px 9px;border-radius:999px}

/* ---------- 섹션 공통 ---------- */
section.block{padding:56px 0;border-top:1px solid var(--line)}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}
.sec-head h2{margin:0;font-size:30px;letter-spacing:-.035em;line-height:1.2}
.sec-head p{margin:6px 0 0;color:var(--muted)}

/* ---------- 프로그램 ---------- */
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.app{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;grid-template-columns:56px 1fr;gap:4px 16px}
.app .ic{grid-row:span 2;width:56px;height:56px;border-radius:15px;background:var(--c);color:#fff;display:grid;place-items:center}
.app .ic svg{width:28px;height:28px}
.app .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.app h3{margin:0;font-size:18px;letter-spacing:-.02em}
.tag{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);padding:1px 8px;border-radius:999px}
.app .d{margin:0;color:var(--muted);font-size:14.5px}
.app .act{grid-column:1 / -1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.get{display:inline-flex;align-items:baseline;gap:7px;padding:9px 16px;border-radius:10px;background:var(--c);color:#fff;font-weight:700;font-size:14px;text-decoration:none}
.get small{font-weight:500;font-size:12px;opacity:.75}
.get[aria-disabled="true"]{opacity:.4;pointer-events:none}
.app .vv{font-family:var(--num);font-weight:800;color:var(--c)}
.app .meta{font-size:13px;color:var(--muted)}
.app .note{font-size:12px;font-weight:600;color:var(--c);background:var(--t);padding:2px 8px;border-radius:6px;margin-left:auto}

/* ---------- 업데이트 소식 (블로그) ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:inherit;font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.filters button:hover{color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

.posts{list-style:none;margin:0;padding:0}
.post{display:grid;grid-template-columns:120px 1fr;gap:28px;padding:30px 0;border-top:1px solid var(--line)}
.post:first-child{border-top:0;padding-top:6px}
.post time{font-family:var(--num);font-weight:700;font-size:15px;color:var(--muted);line-height:1.3;padding-top:4px}
.post time b{display:block;font-size:30px;font-stretch:75%;font-weight:900;color:var(--ink);letter-spacing:-.01em}
.post .pt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.post .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.post .cat{font-size:13px;font-weight:700;color:var(--c)}
.post h3{margin:6px 0 10px;font-size:22px;letter-spacing:-.025em;line-height:1.3}
.post h3 a{text-decoration:none}
.post h3 a:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.post .body{color:#36404A;font-size:15.5px;max-width:42em}
.post .body ul{margin:0;padding-left:20px}
.post .body li{margin:3px 0}
.post .body li::marker{color:var(--c)}
.post .body p{margin:0 0 6px}
.post .body.clip{max-height:9.6em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.post .more{margin-top:8px;font:inherit;font-size:14px;font-weight:700;color:var(--c);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.post .empty{color:var(--muted);font-size:15px}
.morebox{text-align:center;padding-top:24px}
.status{color:var(--muted);padding:20px 0}

footer{border-top:1px solid var(--line);padding:32px 0 56px;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:28px;padding:40px 0 36px}
  .latest .stack{height:300px;max-width:440px}
  .tile:nth-child(2){top:145px}
  .post{grid-template-columns:1fr;gap:6px}
  .post time b{display:inline;font-size:16px;margin-right:6px;font-stretch:100%}
  .sec-head{flex-direction:column;align-items:flex-start}
}
@media (max-width:560px){
  .wrap{padding:0 18px}
  .nav nav a:not(.gh){display:none}
  .app{grid-template-columns:48px 1fr}
  .app .ic{width:48px;height:48px}
  .app .note{margin-left:0}
  .tile .ver{font-size:52px}
}
</style>
</head>
<body>

<header class="nav" id="nav">
  <div class="wrap">
    <a class="logo" href="#top"><img id="avatar" alt=""><span>yoon 작업실</span></a>
    <nav aria-label="메뉴">
      <a href="#apps">프로그램</a>
      <a href="#news">업데이트 소식</a>
      <a class="gh" id="gh" href="#">GitHub</a>
    </nav>
  </div>
</header>

<main id="top">
  <div class="wrap">
    <div class="hero">
      <div>
        <h1>직접 만들어 쓰는<br>프로그램 모음</h1>
        <p>일하다가, 쓰다가 불편했던 걸 직접 고쳐 만들었어요. 새 버전이 나오면 이 페이지에 바로 올라옵니다.</p>
        <div class="links">
          <a class="btn" href="#apps">프로그램 받기</a>
          <a class="btn line" href="#news">업데이트 소식 보기</a>
        </div>
      </div>
      <div class="latest" aria-label="최근 버전">
        <div class="stack" id="tiles"></div>
      </div>
    </div>
  </div>

  <section class="block" id="apps">
    <div class="wrap">
      <div class="sec-head"><div><h2>프로그램</h2><p>최신 버전을 바로 받을 수 있어요.</p></div></div>
      <div class="apps" id="appList"></div>
    </div>
  </section>

  <section class="block" id="news">
    <div class="wrap">
      <div class="sec-head">
        <div><h2>업데이트 소식</h2><p>새 버전을 올릴 때마다 여기에 글이 쌓입니다.</p></div>
        <div class="filters" id="filters" role="group" aria-label="프로그램별 보기"></div>
      </div>
      <ol class="posts" id="posts"><li class="status">소식을 불러오는 중…</li></ol>
      <div class="morebox"><button class="btn line" id="moreBtn" hidden>이전 소식 더 보기</button></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span id="copy"></span>
    <span>버전과 소식은 GitHub Releases에서 자동으로 가져옵니다.</span>
  </div>
</footer>

<script>
/* ============ 설정 ============
   프로그램을 늘리려면 apps에 한 줄 추가. key는 색 이름(g2b, yt) — 새 색은 CSS :root와 .g2b/.yt 처럼 추가 */
const CONFIG = {
  owner: "yoonyoon001945-png",
  apps: [
    { key:"g2b", repo:"yoon", name:"G2B monitor", short:"G2B", category:"Windows",
      desc:"나라장터 입찰공고와 개찰결과를 모아 보는 프로그램", icon:"doc", asset:[".exe"] },
    { key:"yt", repo:"youturbe-morphe-releases", name:"YouTurbe Morphe", short:"YouTurbe", category:"Android",
      desc:"광고 없이 보는 YouTube 앱", icon:"play", asset:[".apk"], note:"사용기간 코드 필요" },
    { key:"net", repo:"Y-NetMon", name:"Y-NetMon", short:"NetMon", category:"Windows",
      desc:"네트워크 연결 상태를 지켜보는 프로그램", icon:"net", asset:[".exe"] }
  ],
  pageSize: 6
};
/* ============================== */

const ICONS = {
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/></svg>',
  net:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>'
};
const O = CONFIG.owner;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymd = s => { const d = new Date(s); return [d.getFullYear(), String(d.getMonth()+1).padStart(2,"0"), String(d.getDate()).padStart(2,"0")]; };
const size = b => b >= 1048576 ? (b/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(b/1024))+" KB";

$("#gh").href = `https://github.com/${O}`;
$("#avatar").src = `https://github.com/${O}.png?size=60`;
$("#copy").textContent = `© ${new Date().getFullYear()} yoon`;
addEventListener("scroll", () => $("#nav").classList.toggle("scrolled", scrollY > 8), {passive:true});

function md(src){
  if(!src || !src.trim()) return "";
  let out = "", ul = false;
  const inl = t => t.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  for(const raw of esc(src).replace(/\r/g,"").split("\n")){
    const l = raw.trim();
    if(/^(바뀐 점|변경 사항)$/.test(l) || /^#+\s/.test(l)) continue;
    const m = l.match(/^[-*+]\s+(.*)/);
    if(m){ if(!ul){out+="<ul>";ul=true;} out+=`<li>${inl(m[1])}</li>`; continue; }
    if(ul){out+="</ul>";ul=false;}
    if(l) out += `<p>${inl(l)}</p>`;
  }
  return out + (ul ? "</ul>" : "");
}

/* 프로그램 카드 (먼저 틀을 그리고, 데이터가 오면 채움) */
for(const a of CONFIG.apps){
  const base = `https://github.com/${O}/${a.repo}/releases`;
  $("#appList").insertAdjacentHTML("beforeend", `
    <article class="app ${a.key}" id="app-${a.key}">
      <div class="ic" aria-hidden="true">${ICONS[a.icon]||""}</div>
      <div class="row1"><h3>${esc(a.name)}</h3><span class="tag">${esc(a.category)}</span></div>
      <p class="d">${esc(a.desc)}</p>
      <div class="act">
        <a class="get" href="${base}" aria-disabled="true">받기</a>
        <span class="meta"><span class="vv">v—</span> <span class="when"></span></span>
        ${a.note ? `<span class="note">${esc(a.note)}</span>` : ""}
      </div>
    </article>`);
}

/* 필터 버튼 */
let filter = "all", shown = CONFIG.pageSize, allPosts = [];
const fbox = $("#filters");
[["all","전체"], ...CONFIG.apps.map(a => [a.key, a.short])].forEach(([k,label]) => {
  const b = document.createElement("button");
  b.textContent = label; b.setAttribute("aria-pressed", k === "all");
  b.onclick = () => { filter = k; shown = CONFIG.pageSize; fbox.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); renderPosts(); };
  fbox.appendChild(b);
});

function renderPosts(){
  const list = allPosts.filter(p => filter === "all" || p.app.key === filter);
  const ul = $("#posts");
  if(!list.length){ ul.innerHTML = `<li class="status">아직 올라온 소식이 없습니다.</li>`; $("#moreBtn").hidden = true; return; }
  ul.innerHTML = list.slice(0, shown).map(p => {
    const [y,m,d] = ymd(p.published_at);
    const body = md(p.body);
    const long = (p.body||"").split("\n").filter(l => l.trim()).length > 5;
    return `
    <li class="post ${p.app.key}">
      <time datetime="${p.published_at}"><b>${m}.${d}</b>${y}</time>
      <div>
        <div class="pt"><span class="dot"></span><span class="cat">${esc(p.app.name)}</span></div>
        <h3><a href="${p.html_url}" target="_blank" rel="noopener">${esc(p.app.short)} ${esc(p.tag_name)} 업데이트</a></h3>
        ${body ? `<div class="body${long ? " clip" : ""}">${body}</div>${long ? `<button class="more" type="button">전체 보기</button>` : ""}`
               : `<p class="empty">파일만 새로 올렸어요. 받기 버튼에서 최신 버전을 받을 수 있습니다.</p>`}
      </div>
    </li>`;
  }).join("");
  ul.querySelectorAll(".more").forEach(btn => btn.onclick = () => { btn.previousElementSibling.classList.remove("clip"); btn.remove(); });
  $("#moreBtn").hidden = shown >= list.length;
}
$("#moreBtn").onclick = () => { shown += CONFIG.pageSize; renderPosts(); };

/* 데이터 가져오기 */
Promise.all(CONFIG.apps.map(a =>
  fetch(`https://api.github.com/repos/${O}/${a.repo}/releases?per_page=30`, {headers:{Accept:"application/vnd.github+json"}})
    .then(r => { if(!r.ok) throw r.status; return r.json(); })
    .then(rel => ({ app:a, rel: rel.filter(r => !r.draft) }))
    .catch(() => ({ app:a, rel:null }))
)).then(results => {
  const tiles = [];
  for(const {app:a, rel} of results){
    const card = $(`#app-${a.key}`), get = card.querySelector(".get");
    get.removeAttribute("aria-disabled");
    if(!rel){ card.querySelector(".when").textContent = "버전 정보를 가져오지 못했어요"; continue; }
    if(!rel.length){ card.querySelector(".when").textContent = "아직 올린 버전이 없어요"; continue; }
    const last = rel.find(r => !r.prerelease) || rel[0];
    let asset = null;
    for(const ext of a.asset){ asset = (last.assets||[]).find(x => x.name.toLowerCase().endsWith(ext)); if(asset) break; }
    if(asset){ get.href = asset.browser_download_url; get.innerHTML = `받기 <small>${size(asset.size)}</small>`; }
    else get.href = last.html_url;
    const [y,m,d] = ymd(last.published_at);
    card.querySelector(".vv").textContent = last.tag_name;
    card.querySelector(".when").textContent = `· ${y}.${m}.${d}`;
    tiles.push({a, last});
    rel.forEach(r => allPosts.push({...r, app:a}));
  }
  allPosts.sort((x,y) => new Date(y.published_at) - new Date(x.published_at));
  renderPosts();

  /* 첫 화면 오른쪽: 가장 최근에 업데이트된 프로그램 2개 (최신이 앞으로) */
  tiles.sort((x,y) => new Date(x.last.published_at) - new Date(y.last.published_at));
  const newest = tiles.length ? tiles[tiles.length-1] : null;
  $("#tiles").innerHTML = tiles.slice(-2).map(({a,last}) => {
    const [y,m,d] = ymd(last.published_at);
    return `<a class="tile ${a.key}" href="#app-${a.key}" style="text-decoration:none">
      <div class="hd"><div class="ic" aria-hidden="true">${ICONS[a.icon]||""}</div>
      <div><div class="nm">${esc(a.name)}</div><div class="when">${y}.${m}.${d}${last === newest.last ? `<span class="new">최근 업데이트</span>` : ""}</div></div></div>
      <div class="ver">${esc(last.tag_name)}</div>
    </a>`;
  }).join("");
});
</script>
</body>
</html>
